---
version: "3"

tasks:
  default:
    cmds: [task: lint]

  lint:
    desc: Run every quality gate
    cmds:
      - pre-commit run --all-files

  test:
    desc: Validate every workflow in the catalog
    cmds:
      - actionlint .github/workflows/*.yml

  security:
    desc: Scan Git history for exposed secrets
    cmds:
      - gitleaks git --redact --no-banner .
